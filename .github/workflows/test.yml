name: Unit tests

on: 
  push: 
    branches:
      - 'chameleoncloud/**'
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            toxenv: py39
          - python-version: "3.10"
            toxenv: py310
          - python-version: "3.11"
            toxenv: py311
          - python-version: "3.12"
            toxenv: py312
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install tox
      # set python version explicitly to work around sets basepython = python310
      - run: tox -e ${{ matrix.toxenv }}
